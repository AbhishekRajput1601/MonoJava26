<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        .wrap { max-width: 620px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 24px; }
        .field { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 9px; border: 1px solid #d1d5db; border-radius: 5px; box-sizing: border-box; }
        button, a { display: inline-block; margin-top: 8px; padding: 10px 14px; border-radius: 6px; text-decoration: none; border: 0; cursor: pointer; }
        button { background: #16a34a; color: #fff; }
        a { background: #6b7280; color: #fff; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Add User</h1>
    <p><strong> User ID for this user :</strong> <span id="nextUserId">Loading...</span></p>
    <form id="addUserForm" method="post">
        <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>
        </div>
        <div class="field">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="1" max="150" required>
        </div>
        <div class="field">
            <label for="mobileNo">Mobile No</label>
            <input id="mobileNo" name="mobileNo" type="text" required>
        </div>
        <div class="field">
            <label for="departmentName">Department Name</label>
            <input id="departmentName" name="departmentName" type="text" required>
        </div>
        <div class="field">
            <label for="courseName">Course Name</label>
            <input id="courseName" name="courseName" type="text" required>
        </div>
        <button type="submit">Create User</button>
        <a href="curdoperation.html">Back Home</a>
    </form>
</div>

<script>
    function getCrudUrl() {
        var parts = window.location.pathname.split('/').filter(Boolean);
        var contextPath = parts.length > 0 ? '/' + parts[0] : '';
        return window.location.origin + contextPath + '/crud';
    }

    document.getElementById('addUserForm').setAttribute('action', getCrudUrl());

    fetch(getCrudUrl() + '/next-id')
        .then(function (res) {
            return res.json();
        })
        .then(function (data) {
            document.getElementById('nextUserId').textContent = data.nextId;
        })
        .catch(function () {
            document.getElementById('nextUserId').textContent = 'Unavailable';
        });
</script>
</body>
</html>
